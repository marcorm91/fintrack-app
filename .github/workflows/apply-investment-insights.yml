name: Apply investment performance insights

on:
  push:
    branches:
      - feat/investment-contributions
    paths:
      - scripts/add-investment-insights.py
      - .github/workflows/apply-investment-insights.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/investment-contributions
          fetch-depth: 0

      - name: Apply insights
        run: python scripts/add-investment-insights.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: npm run check

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/add-investment-insights.py .github/workflows/apply-investment-insights.yml
          git add src
          git commit -m "Feat(investment): add performance insights"
          git push origin feat/investment-contributions
