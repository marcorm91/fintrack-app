name: Validate investment contribution changes

on:
  push:
    branches:
      - feat/investment-contributions
    paths:
      - .github/workflows/apply-investment-contributions.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/investment-contributions

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run full check
        run: npm run check
