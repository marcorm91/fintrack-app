name: Apply optional contribution fix

on:
  push:
    branches:
      - fix/optional-portfolio-contribution
    paths:
      - .github/workflows/apply-optional-contribution-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/optional-portfolio-contribution
          fetch-depth: 0

      - name: Apply changes
        run: |
          python scripts/apply_optional_contribution_fix.py
          npm version 3.3.3 --no-git-tag-version

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: npm run check

      - name: Commit final changes
        run: |
          git config user.name "Marco Romero"
          git config user.email "marco_antonio88_9@hotmail.com"
          git rm .github/workflows/apply-optional-contribution-fix.yml scripts/apply_optional_contribution_fix.py
          git add src/hooks/useMonthlyForm.ts package.json package-lock.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json README.md
          git commit -m "Fix(investment): allow clearing contribution"
          git push origin HEAD:fix/optional-portfolio-contribution
