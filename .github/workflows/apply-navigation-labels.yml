name: Apply navigation label polish

on:
  push:
    branches:
      - fix/navigation-labels

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Apply labels and version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          es = Path('src/locales/es.json')
          text = es.read_text(encoding='utf-8')
          old = '"tabs":{"month":"Mes actual","year":"Vista anual","all":"Histórico"}'
          new = '"tabs":{"month":"Mes","year":"Anual","all":"Histórico"}'
          if old not in text:
              raise SystemExit('Expected Spanish tab labels not found')
          es.write_text(text.replace(old, new, 1), encoding='utf-8')

          en = Path('src/locales/en.json')
          text = en.read_text(encoding='utf-8')
          old = '"tabs":{"month":"Current month","year":"Annual view","all":"History"}'
          new = '"tabs":{"month":"Month","year":"Annual","all":"History"}'
          if old not in text:
              raise SystemExit('Expected English tab labels not found')
          en.write_text(text.replace(old, new, 1), encoding='utf-8')

          package = Path('package.json')
          data = json.loads(package.read_text(encoding='utf-8'))
          if data.get('version') != '3.3.1':
              raise SystemExit(f"Unexpected package version: {data.get('version')}")
          data['version'] = '3.3.2'
          package.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          lock = Path('package-lock.json')
          data = json.loads(lock.read_text(encoding='utf-8'))
          if data.get('version') != '3.3.1' or data.get('packages', {}).get('', {}).get('version') != '3.3.1':
              raise SystemExit('Unexpected package-lock root version')
          data['version'] = '3.3.2'
          data['packages']['']['version'] = '3.3.2'
          lock.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          cargo = Path('src-tauri/Cargo.toml')
          text = cargo.read_text(encoding='utf-8')
          marker = 'version = "3.3.1"'
          if marker not in text:
              raise SystemExit('Expected Cargo.toml version not found')
          cargo.write_text(text.replace(marker, 'version = "3.3.2"', 1), encoding='utf-8')

          cargo_lock = Path('src-tauri/Cargo.lock')
          text = cargo_lock.read_text(encoding='utf-8')
          marker = '[[package]]\nname = "fintrack-app"\nversion = "3.3.1"'
          if marker not in text:
              raise SystemExit('Expected Cargo.lock app version not found')
          cargo_lock.write_text(text.replace(marker, '[[package]]\nname = "fintrack-app"\nversion = "3.3.2"', 1), encoding='utf-8')

          tauri = Path('src-tauri/tauri.conf.json')
          data = json.loads(tauri.read_text(encoding='utf-8'))
          if data.get('version') != '3.3.1':
              raise SystemExit(f"Unexpected Tauri version: {data.get('version')}")
          data['version'] = '3.3.2'
          tauri.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          if '3.3.1' not in text:
              raise SystemExit('Expected README version not found')
          readme.write_text(text.replace('3.3.1', '3.3.2'), encoding='utf-8')
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: npm run check

      - name: Commit final changes
        shell: bash
        run: |
          rm .github/workflows/apply-navigation-labels.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix(navigation): simplify period tab labels"
          git push
