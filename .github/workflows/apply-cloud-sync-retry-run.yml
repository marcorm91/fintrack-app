name: Apply cloud sync retry patch

on:
  push:
    branches:
      - fix/cloud-sync-retry
    paths:
      - .github/workflows/apply-cloud-sync-retry-run.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/cloud-sync-retry
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply changes
        run: python scripts/apply-cloud-sync-retry.py

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: npm run check

      - name: Commit final changes
        shell: bash
        run: |
          git config user.name "Marco Romero"
          git config user.email "marco_antonio88_9@hotmail.com"
          git rm .github/workflows/apply-cloud-sync-retry.yml
          git rm .github/workflows/apply-cloud-sync-retry-run.yml
          git rm scripts/apply-cloud-sync-retry.py
          git add src/hooks/useCloudSync.ts src/components/Dialogs.tsx src/locales/es.json src/locales/en.json package.json package-lock.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json README.md
          git commit -m "Fix(sync): retry transient cloud failures"
          git push origin HEAD:fix/cloud-sync-retry
