name: Android APK (artifact)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag de la release a la que adjuntar el APK/AAB (opcional)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      ANDROID_API_LEVEL: "34"
      BUILD_TOOLS_VERSION: "34.0.0"
      ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Android signing secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [ -n "$ANDROID_KEYSTORE_B64" ] || missing+=("ANDROID_KEYSTORE_BASE64")
          [ -n "$ANDROID_KEYSTORE_PASSWORD" ] || missing+=("ANDROID_KEYSTORE_PASSWORD")
          [ -n "$ANDROID_KEY_ALIAS" ] || missing+=("ANDROID_KEY_ALIAS")
          [ -n "$ANDROID_KEY_PASSWORD" ] || missing+=("ANDROID_KEY_PASSWORD")
          if (( ${#missing[@]} )); then
            printf 'Missing required Android signing secret: %s\n' "${missing[@]}"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-${{ env.ANDROID_API_LEVEL }}
            build-tools;${{ env.BUILD_TOOLS_VERSION }}

      - name: Install latest available NDK
        shell: bash
        run: |
          set -euo pipefail
          NDK_PKG=$(sdkmanager --list | grep -oE 'ndk;[0-9.]+' | sort -V | tail -n1)
          if [ -z "$NDK_PKG" ]; then
            echo "No NDK package found via sdkmanager --list"
            exit 1
          fi
          echo "Installing $NDK_PKG"
          sdkmanager "$NDK_PKG"
          NDK_VER="${NDK_PKG#ndk;}"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/$NDK_VER" >> "$GITHUB_ENV"

      - name: Install JS dependencies
        run: npm ci

      - name: Decode Android keystore
        shell: bash
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/fintrack.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/fintrack.keystore" >> "$GITHUB_ENV"

      - name: Init Android project
        run: npm run android:init

      - name: Build Android
        run: npm run android:build

      - name: Upload APK/AAB
        uses: actions/upload-artifact@v4
        with:
          name: fintrack-android
          path: |
            artifacts/android/*.apk
            artifacts/android/*.aab

      - name: Attach APK/AAB to release
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: ${{ github.event_name == 'push' }}
          fail_on_unmatched_files: true
          files: |
            artifacts/android/*.apk
            artifacts/android/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
