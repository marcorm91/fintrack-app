name: Apply tooltip and tab fixes

on:
  push:
    branches:
      - fix/investment-tooltip-month-tab
    paths:
      - .github/workflows/apply-tooltip-tab-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/investment-tooltip-month-tab

      - name: Apply fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          charts = Path('src/hooks/useCharts.ts')
          text = charts.read_text()
          old = """            label: (context: TooltipItem<'bar'>) =>\n              `${context.dataset.label}: ${formatEuro(context.parsed.y ?? 0)} EUR`"""
          new = """            label: (context: TooltipItem<'bar'>) => {\n              const isPortfolioResult =\n                context.dataset.label === translate('investment.resultAccumulated');\n              const value = isPortfolioResult\n                ? (yearSeries[context.dataIndex]?.portfolioResultCents ?? 0) / 100\n                : (context.parsed.y ?? 0);\n              return `${context.dataset.label}: ${formatEuro(value)} EUR`;\n            }"""
          if old not in text:
              raise SystemExit('Expected yearly tooltip callback not found')
          text = text.replace(old, new, 1)
          old_deps = """    }),\n    []\n  );\n\n  const allYearsChartData"""
          new_deps = """    }),\n    [translate, yearSeries]\n  );\n\n  const allYearsChartData"""
          if old_deps not in text:
              raise SystemExit('Expected yearly chart options dependency block not found')
          charts.write_text(text.replace(old_deps, new_deps, 1))

          constants = Path('src/constants.ts')
          text = constants.read_text()
          old_tab = "{ key: 'month', labelKey: 'tabs.month' }"
          if old_tab not in text:
              raise SystemExit('Expected month tab definition not found')
          constants.write_text(text.replace(old_tab, "{ key: 'month', labelKey: 'labels.month' }", 1))

          cargo = Path('src-tauri/Cargo.toml')
          text = cargo.read_text()
          old_version = 'name = "fintrack-app"\nversion = "3.3.0"'
          if old_version not in text:
              raise SystemExit('Expected Cargo.toml version not found')
          cargo.write_text(text.replace(old_version, 'name = "fintrack-app"\nversion = "3.3.1"', 1))

          cargo_lock = Path('src-tauri/Cargo.lock')
          text = cargo_lock.read_text()
          if old_version not in text:
              raise SystemExit('Expected Cargo.lock package version not found')
          cargo_lock.write_text(text.replace(old_version, 'name = "fintrack-app"\nversion = "3.3.1"', 1))

          tauri = Path('src-tauri/tauri.conf.json')
          config = json.loads(tauri.read_text())
          if config.get('version') != '3.3.0':
              raise SystemExit(f"Unexpected Tauri version: {config.get('version')}")
          config['version'] = '3.3.1'
          tauri.write_text(json.dumps(config, ensure_ascii=False, indent=2) + '\n')

          readme = Path('README.md')
          text = readme.read_text()
          if '3.3.0' not in text:
              raise SystemExit('Expected README 3.3.0 references not found')
          readme.write_text(text.replace('3.3.0', '3.3.1'))
          PY

          npm version 3.3.1 --no-git-tag-version

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: npm run check

      - name: Commit final changes
        shell: bash
        run: |
          rm .github/workflows/apply-tooltip-tab-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix(investment): correct loss tooltip and month tab"
          git push origin HEAD:fix/investment-tooltip-month-tab
